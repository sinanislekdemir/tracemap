# nfpm configuration for building the Linux .deb and .rpm packages.
# VERSION is provided by the release workflow (the git tag without the leading v).
name: tracemap
arch: amd64
platform: linux
version: ${VERSION}
release: "1"
section: net
priority: optional
maintainer: Sinan Islekdemir <sinan@islekdemir.com>
vendor: Sinan Islekdemir
homepage: https://github.com/sinanislekdemir/tracemap
license: MIT
description: |
  A desktop traceroute visualizer.

  tracemap runs traceroute/tracert from your machine, geolocates every
  responsive hop and draws the path on an interactive world map. It can resolve
  a domain's DNS records, discover subdomains locally, and save traces to replay
  and compare them.

contents:
  - src: build/bin/traceroute
    dst: /usr/bin/tracemap
  - src: build/linux/tracemap.desktop
    dst: /usr/share/applications/tracemap.desktop
  - src: build/appicon.png
    dst: /usr/share/icons/hicolor/256x256/apps/tracemap.png
  # License and third-party notices, including the Qt LGPL/GPL texts the
  # dynamically linked build must ship.
  - src: LICENSE
    dst: /usr/share/doc/tracemap/LICENSE
  - src: THIRD_PARTY_NOTICES.md
    dst: /usr/share/doc/tracemap/THIRD_PARTY_NOTICES.md
  - src: LICENSES/LGPL-3.0.txt
    dst: /usr/share/doc/tracemap/LICENSES/LGPL-3.0.txt
  - src: LICENSES/GPL-3.0.txt
    dst: /usr/share/doc/tracemap/LICENSES/GPL-3.0.txt

# The minimum Qt ABI is pinned (see QT_BASELINE in release.yml): the binary is
# built against Ubuntu 24.04's Qt6, so an unversioned dependency would let apt
# install it on a system with an older Qt that cannot load it. Bump both together.
overrides:
  deb:
    depends:
      - libqt6widgets6 (>= 6.4)
  rpm:
    depends:
      - qt6-qtbase-gui >= 6.4
