name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned, not *-latest: the binary links against the runner's Qt6, and
          # the .deb/.rpm declare that Qt ABI as a minimum. Moving the runner
          # changes the required Qt symbols, so the baseline is explicit and the
          # "Verify Linux Qt baseline" step fails if it drifts.
          - name: linux-amd64
            os: ubuntu-24.04
          - name: darwin-arm64
            os: macos-14
    env:
      # Minimum Qt6 the released Linux binaries are built against (Ubuntu 24.04).
      # Keep in sync with nfpm.yaml's Depends and the macOS deployment target.
      QT_BASELINE: "6.4"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Qt6 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev g++ binutils

      - name: Install Qt6 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qt
          echo "PKG_CONFIG_PATH=$(brew --prefix qt)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "$(brew --prefix qt)/bin" >> "$GITHUB_PATH"

      - name: Build
        run: make build

      - name: Verify Linux Qt baseline
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          required="$(readelf --version-info build/bin/traceroute \
            | grep -oE 'Qt_6\.[0-9]+' | sort -uV | tail -n1 || true)"
          echo "Binary requires ${required:-<none>}; declared baseline is Qt_${QT_BASELINE}"
          if [ -z "$required" ]; then
            echo "::error::could not determine the binary's Qt requirement"
            exit 1
          fi
          newest="$(printf '%s\n%s\n' "${required#Qt_}" "$QT_BASELINE" | sort -V | tail -n1)"
          if [ "$newest" != "$QT_BASELINE" ]; then
            echo "::error::binary requires ${required}, newer than the declared baseline Qt_${QT_BASELINE}; bump QT_BASELINE and nfpm.yaml together."
            exit 1
          fi

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czf "tracemap-${GITHUB_REF_NAME}-linux-amd64.tar.gz" -C build/bin traceroute
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/ ]]; then VERSION="0.0.0"; fi
          export VERSION
          nfpm package --config nfpm.yaml --packager deb --target "tracemap-${GITHUB_REF_NAME}-linux-amd64.deb"
          nfpm package --config nfpm.yaml --packager rpm --target "tracemap-${GITHUB_REF_NAME}-linux-amd64.rpm"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP="build/bin/tracemap.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/bin/traceroute "$APP/Contents/MacOS/tracemap"
          cp build/appicon.png "$APP/Contents/Resources/appicon.png"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>tracemap</string>
            <key>CFBundleDisplayName</key><string>Traceroute Map</string>
            <key>CFBundleIdentifier</key><string>com.islekdemir.tracemap</string>
            <key>CFBundleExecutable</key><string>tracemap</string>
            <key>CFBundleIconFile</key><string>appicon.png</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0.0</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          macdeployqt "$APP" -always-overwrite
          ditto -c -k --keepParent "$APP" "tracemap-${GITHUB_REF_NAME}-darwin-arm64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tracemap-${{ matrix.name }}
          path: tracemap-*
          if-no-files-found: error

  # Windows is cross-compiled from Linux (no Windows runner) with a cached
  # MinGW-w64 + statically linked Qt6 container, mirroring recovery-qt's win/
  # setup. The result is one self-contained tracemap.exe with no DLLs to ship.
  build-windows:
    name: Build windows-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build cross-compile image
        uses: docker/build-push-action@v6
        with:
          context: win
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tracemap-win-build:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/tracemap-win-build:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/tracemap-win-build:buildcache,mode=max

      - name: Build Windows exe
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            ghcr.io/${{ github.repository_owner }}/tracemap-win-build:latest \
            bash win/docker-build.sh

      - name: Package Windows zip
        run: |
          zip -j "tracemap-${GITHUB_REF_NAME}-windows-amd64.zip" build-win/tracemap.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tracemap-windows-amd64
          path: tracemap-*
          if-no-files-found: error

  # A portable single-file AppImage. Built inside Debian 12 rather than the
  # Ubuntu 24.04 runner: Debian 12 ships Qt 6.4 (the miqt baseline) on an older
  # glibc (2.36 vs 2.39), so the bundled binary runs on more distributions.
  # Mirrors scripts/build-appimage.sh (the same linuxdeploy recipe as poorman).
  appimage:
    name: Build linux-x86_64 AppImage
    runs-on: ubuntu-24.04
    container: debian:12
    timeout-minutes: 45
    steps:
      # The debian:12 image ships no git, and actions/checkout needs it.
      - name: Install checkout prerequisites
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build AppImage
        env:
          INSTALL_DEPS: "1"
          DEBIAN_FRONTEND: noninteractive
        run: |
          chmod +x scripts/build-appimage.sh
          if [[ "$GITHUB_REF" =~ ^refs/tags/ ]]; then
            export VERSION="${GITHUB_REF_NAME}"
          else
            export VERSION="0.0.0"
          fi
          ./scripts/build-appimage.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tracemap-appimage-linux-x86_64
          path: |
            tracemap-*-x86_64.AppImage
            tracemap-*-x86_64.AppImage.zsync
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, build-windows, appimage]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
          # Only our release artifacts; a transient `<owner>~<repo>~*.dockerbuild`
          # cache artifact from the Windows image build is ignored.
          pattern: tracemap-*

      # Create (or reuse) the release as a draft so users never see a partial
      # release. It is published only after every asset has been uploaded.
      - name: Create draft release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; reusing it."
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi

      - name: Upload assets
        run: |
          set -uo pipefail
          shopt -s nullglob
          assets=(artifacts/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No assets found under artifacts/"
            exit 1
          fi
          failed=0
          for f in "${assets[@]}"; do
            name="$(basename "$f")"
            echo "::group::Uploading $name"
            ok=0
            for attempt in 1 2 3 4; do
              start=$SECONDS
              if timeout --kill-after=20 180 \
                  gh release upload "$GITHUB_REF_NAME" "$f" --clobber; then
                echo "Uploaded $name in $((SECONDS - start))s"
                ok=1
                break
              fi
              echo "Attempt $attempt failed for $name after $((SECONDS - start))s"
              delay=$((attempt * 15))
              echo "Retrying in ${delay}s..."
              sleep "$delay"
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::Failed to upload $name after 4 attempts"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Publish release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
