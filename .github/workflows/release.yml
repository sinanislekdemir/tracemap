name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            build: wails build -tags webkit2_41
            package: tar -czf "tracemap-${GITHUB_REF_NAME}-linux-amd64.tar.gz" -C build/bin traceroute
          - name: darwin-universal
            os: macos-latest
            build: wails build -platform darwin/universal
            package: ditto -c -k --keepParent build/bin/traceroute.app "tracemap-${GITHUB_REF_NAME}-darwin-universal.zip"
          - name: windows-amd64
            os: windows-latest
            build: wails build
            package: powershell -NoProfile -Command "Compress-Archive -Path ./build/bin/traceroute.exe -DestinationPath 'tracemap-${GITHUB_REF_NAME}-windows-amd64.zip' -Force"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        run: ${{ matrix.build }}

      - name: Package
        shell: bash
        run: ${{ matrix.package }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: tracemap-*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
