name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            build: wails build -tags webkit2_41
            package: tar -czf "tracemap-${GITHUB_REF_NAME}-linux-amd64.tar.gz" -C build/bin traceroute
          - name: darwin-universal
            os: macos-latest
            build: wails build -platform darwin/universal
            package: ditto -c -k --keepParent build/bin/traceroute.app "tracemap-${GITHUB_REF_NAME}-darwin-universal.zip"
          - name: windows-amd64
            os: windows-latest
            build: wails build
            package: powershell -NoProfile -Command "Compress-Archive -Path ./build/bin/traceroute.exe -DestinationPath 'tracemap-${GITHUB_REF_NAME}-windows-amd64.zip' -Force"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        run: ${{ matrix.build }}

      - name: Package
        shell: bash
        run: ${{ matrix.package }}

      - name: Build Linux packages (deb, rpm)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/ ]]; then VERSION="0.0.0"; fi
          export VERSION
          nfpm package --config nfpm.yaml --packager deb --target "tracemap-${GITHUB_REF_NAME}-linux-amd64.deb"
          nfpm package --config nfpm.yaml --packager rpm --target "tracemap-${GITHUB_REF_NAME}-linux-amd64.rpm"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: tracemap-*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Create (or reuse) the release as a draft so users never see a partial
      # release. It is published only after every asset has been uploaded.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; reusing it."
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi

      # Upload assets one at a time with backoff. The previous parallel uploader
      # failed the whole job when a single asset hit a transient API error.
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          failed=0
          shopt -s nullglob
          assets=(artifacts/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No assets found under artifacts/"
            exit 1
          fi
          for f in "${assets[@]}"; do
            name="$(basename "$f")"
            echo "::group::Uploading $name"
            ok=0
            for attempt in 1 2 3 4 5; do
              if gh release upload "$GITHUB_REF_NAME" "$f" --clobber; then
                ok=1
                break
              fi
              delay=$((attempt * 15))
              echo "Attempt $attempt failed for $name; retrying in ${delay}s..."
              sleep "$delay"
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::Failed to upload $name after 5 attempts"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
